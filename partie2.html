<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partie 2 : Australie</title>
  <style>
    :root { --paper:#fffaf2; --ink:#1f2a2e; --muted:#6d6b66; --accent:#1d6f78; --accent2:#b8753b; --shadow:0 24px 60px rgba(31,42,46,.18); --radius:30px; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,"Times New Roman",serif; color:var(--ink); background:radial-gradient(circle at top left, rgba(29,111,120,.18), transparent 34rem), radial-gradient(circle at top right, rgba(184,117,59,.16), transparent 30rem), linear-gradient(180deg,#f6f0e8,#efe7dc); line-height:1.65; }
    .page { max-width:1000px; min-height:100vh; margin:0 auto; padding:28px 18px 70px; display:flex; align-items:center; }
    .panel { width:100%; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); background:var(--paper); }
    .visual { min-height:440px; background:linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.64)), url("https://commons.wikimedia.org/wiki/Special:Redirect/file/Sydney_Opera_House_and_Harbour_Bridge_Dusk_(2)_2019-06-21.jpg") center/cover no-repeat; color:white; display:flex; align-items:flex-end; padding:44px; }
    .visual h1 { font-size:clamp(2.2rem,6vw,5rem); line-height:1; letter-spacing:-.055em; margin:0; }
    .body { padding:34px; font-size:1.15rem; }
    .kicker { color:var(--accent2); text-transform:uppercase; letter-spacing:.16em; font-size:.78rem; font-weight:700; font-family:Arial,sans-serif; margin-bottom:10px; }
    .home-button { display:inline-block; margin-top:18px; padding:13px 20px; border-radius:999px; background:var(--accent); color:white; text-decoration:none; font-family:Arial,sans-serif; font-weight:700; }
    @media(max-width:700px) { .page { padding:14px 10px 48px; } .visual { min-height:340px; padding:28px; } .body { padding:24px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel">
      <div class="visual"><div><div class="kicker">Partie 2</div><h1>Australie</h1></div></div>
      <div class="body">
        <p>Cette page est en construction.</p>
        <p>Le contenu détaillé sera ajouté dans une prochaine étape.</p>
        <a class="home-button" href="index.html">← Retour à l’accueil</a>
      </div>
    </section>
  </main>
</body>
</html>
